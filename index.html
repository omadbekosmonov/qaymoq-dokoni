 if(AT=="narx")b=`<p class="small">Konstruktordagi ingrediyent narxlari (so‘m):</p><div class="frm" style="max-width:360px">${[["base","Tort asosi"],["choc","Shokolad oqizish"],["strawberry","1 ta qulupnay"],["macaron","1 ta makaron"]].map(([k,l])=>`<label>${l}<input class="in" type="number" min="0" value="${P[k]}" data-ch="price" data-k="${k}"></label>`).join("")}</div>`;
 if(AT=="buy")b=db.orders.length?[...db.orders].reverse().map(o=>`<div class="ord"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><b>Buyurtma #${o.id}</b><span class="small">${esc(o.date)}</span>
  <span><select data-ch="st" data-id="${o.id}">${["Yangi","Pishirilmoqda","Tayyor","Topshirildi"].map(s=>`<option ${s==o.status?"selected":""}>${s}</option>`).join("")}</select> <button class="ghost" data-act="delo" data-id="${o.id}">🗑</button></span></div>
  <div>${esc(o.name)} · <a href="tel:${esc(o.phone)}" style="color:var(--p)">${esc(o.phone)}</a> · ${esc(o.address)}</div>${o.items.map(i=>`<div style="display:flex;gap:10px;margin-top:8px"><img src="${i.img||art("#ddd")}" alt=""><div><b>${esc(i.name)}</b> × ${i.qty}<div class="small">${i.ings?"Tarkibi: "+esc(i.ings.join(", ")):""}</div></div></div>`).join("")}<div class="sum" style="margin:8px 0 0">${som(o.total)} <span class="small">(yetkazish: ${o.fee?som(o.fee):"bepul"})</span></div></div>`).join(""):'<p class="small">Buyurtmalar hali yo‘q.</p>';
 if(AT=="shr"){const all=[];Object.entries(db.reviews).forEach(([id,a])=>a.forEach((x,i)=>all.push({id,i,x})));b=all.length?all.map(({id,i,x})=>`<div class="rv"><b>${esc(x.name)}</b> ${"★".repeat(x.rating)} · <span class="small">${esc(byId(id)?.name||"o‘chirilgan tort")}</span> <button class="ghost" data-act="delr" data-id="${id}" data-i="${i}">🗑</button><div>${esc(x.text)}</div>${x.img?`<img src="${x.img}" alt="">`:""}</div>`).join(""):'<p class="small">Sharhlar yo‘q.</p>'}
 if(AT=="qr"){const u=siteUrl();b=`<div style="text-align:center">${qrBox(u,300)}<p><b style="word-break:break-all">${esc(u)}</b></p><a class="cta" download="qr-kod.png" href="${qrPng(u,1000)}">PNG yuklab olish</a></div>${qrNote(u)}<p class="small">Telefon kamerasi bilan skanerlansa, sayt ochiladi. Manzilni o‘zgartirish: Sayt sozlamalari → Sayt manzili.</p>`}
 if(AT=="sayt")b=`<div class="frm" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${sin("name","Do‘kon nomi")}${sin("phone","Telefon")}${sin("addr","Manzil")}${sin("tg","Telegram (@nom)")}${sin("bTitle","Banner sarlavhasi")}${sin("bText","Banner matni")}
  ${sin("cats","Kategoriyalar (vergul bilan)")}${sin("fee","Yetkazish narxi (so‘m)","number")}${sin("free","Bepul yetkazish chegarasi (so‘m)","number")}${sin("c1","Asosiy rang","color")}${sin("c2","Tugma rangi (sariq)","color")}${sin("url","Sayt manzili (QR kod uchun, https://…)")}${sin("pw","Admin paroli (bo‘sh = admin123)")}
  <label>Banner rasmi<input class="in" type="file" accept="image/*" data-ch="site" data-f="bImg"></label></div>
  <div class="act"><button class="ghost" data-act="rmb">Banner rasmini olib tashlash</button><button class="ghost" data-act="reset">Dizaynni boshlang‘ich holatga qaytarish</button></div>`;
 app.innerHTML=`<div class="bar"><h2>Admin panel</h2><button class="ghost" data-act="logout">Chiqish</button></div><div class="adm"><div class="side">${Object.entries(TABS).map(([k,l])=>`<button class="${k==AT?"on":""}" data-act="tab" data-v="${k}">${l}${k=="buy"?" ("+db.orders.length+")":""}</button>`).join("")}</div><div class="box">${b}</div></div>`}

/* ===== QR kod ===== */
function qrPng(text,size=640){try{const q=new QRLIB(-1,0);q.addData(text);q.make();const n=q.getModuleCount(),m=4,cs=Math.max(2,Math.floor(size/(n+2*m))),px=cs*(n+2*m),c=document.createElement("canvas");c.width=c.height=px;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,px,px);x.fillStyle="#000";for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect((k+m)*cs,(r+m)*cs,cs,cs);return c.toDataURL("image/png")}catch{return ""}}
const siteUrl=()=>(db.site.url||"").trim()||location.href.split("#")[0];
const qrBox=(u,w=240)=>`<img src="${qrPng(u)}" alt="QR kod" width="${w}" height="${w}" style="border:1px solid var(--ln);border-radius:12px;background:#fff;max-width:100%;height:auto">`;
const qrNote=u=>/^https?:/.test(u)?"":'<p class="small">Hozir sayt kompyuteringizdagi fayl sifatida ochilgan, shuning uchun bu QR boshqa telefonda ishlamaydi. Saytni internetga joylang va manzilini Admin → Sayt sozlamalari → «Sayt manzili» ga yozing.</p>';

/* ===== Oyna (modal): confirm() o'rniga, chunki ba'zi oynalarda confirm bloklanadi ===== */
const modal=h=>{$("#mbx").innerHTML=h;$("#md").hidden=false},closeM=()=>{$("#md").hidden=true};
let onYes=null;const ask=(t,fn)=>{onYes=fn;modal(`<p style="margin-top:0">${esc(t)}</p><div class="act"><button class="cta" data-act="yes">Ha</button><button class="ghost" data-act="mclose">Yo‘q</button></div>`)};

/* ===== Hodisalar ===== */
const A={
 cat(t){F.cat=t.dataset.v;cur!="/"?go("/"):home()},
 open(t){go("/tort/"+t.dataset.id)},
 add(t){const p=byId(t.dataset.id);if(p.off)return;const k="p"+p.id,c=db.cart.find(x=>x.key==k);c?c.qty++:db.cart.push({key:k,pid:p.id,name:p.name,price:pr(p),qty:1});save();badges();toast("Savatga qo‘shildi")},
 fav(t){const id=+t.dataset.id,i=db.favs.indexOf(id);i<0?db.favs.push(id):db.favs.splice(i,1);save();badges();route(true)},
 async share(t){const p=byId(t.dataset.id),u=location.href.split("#")[0]+"#/tort/"+p.id,e=encodeURIComponent;
  try{if(navigator.share){await navigator.share({title:p.name,text:p.name+" — "+db.site.name,url:u});return}}catch(x){if(x&&x.name=="AbortError")return}
  modal(`<h3 style="margin-top:0">Ulashish</h3><p class="small">${esc(p.name)}</p><input class="in" id="shu" value="${esc(u)}" readonly onfocus="this.select()">
  <div style="text-align:center;margin:10px 0">${qrBox(u,150)}</div>${/^https?:/.test(u)?"":'<p class="small">Havola sayt internetga joylangandan keyin boshqalarda ochiladi.</p>'}
  <div class="act"><button class="cta" data-act="copy">Havolani nusxalash</button></div>
  <div class="act"><a class="ghost" target="_blank" rel="noopener" href="https://t.me/share/url?url=${e(u)}&text=${e(p.name)}">Telegram</a><a class="ghost" target="_blank" rel="noopener" href="https://wa.me/?text=${e(p.name+" "+u)}">WhatsApp</a><button class="ghost" data-act="mclose">Yopish</button></div>`)},
 copy(){const i=$("#shu");i.focus();i.select();i.setSelectionRange(0,9999);let ok=false;try{ok=document.execCommand("copy")}catch{}if(!ok)try{navigator.clipboard.writeText(i.value).catch(()=>{});ok=true}catch{}toast(ok?"Havola nusxalandi":"Havolani qo‘lda nusxalang")},
 qr(){const u=siteUrl();modal(`<h3 style="margin-top:0">📱 Telefonda oching</h3><div style="text-align:center">${qrBox(u,260)}<p class="small" style="word-break:break-all">${esc(u)}</p></div>${qrNote(u)}<div class="act"><button class="ghost" data-act="mclose">Yopish</button></div>`)},
 yes(){closeM();const f=onYes;onYes=null;f&&f()},
 mclose(){closeM()},
 qp(t){db.cart[t.dataset.i].qty++;save();badges();cartPage()},
 qm(t){const c=db.cart[t.dataset.i];if(--c.qty<=0)db.cart.splice(t.dataset.i,1);save();badges();cartPage()},
 choc(){C.choc=!C.choc;$("#bch").classList.toggle("on",C.choc);const g=$("#ch");g.style.opacity=C.choc?1:0;g.style.transform=C.choc?"none":"translateY(-40px)";csum()},
 addi(t){addI(t.dataset.t)},
 cream(t){C.cream=t.dataset.v;$("#sd").setAttribute("fill",C.cream);$("#tp").setAttribute("fill",C.cream);$$(".sw").forEach(s=>s.classList.toggle("on",s==t))},
 async cadd(){try{const r=crows(),img=await snap();db.cart.push({key:"c"+Date.now(),name:"Maxsus tort (konstruktor)",price:r.reduce((s,x)=>s+x[2],0),qty:1,img,ings:r.map(x=>x[0]+(x[1]>1?" × "+x[1]:""))});save();badges();toast("Dizayn savatga qo‘shildi");go("/savat")}catch{toast("Rasm olinmadi, qayta urinib ko‘ring")}},
 back(){const p=hist.pop()||"/";cur=p;try{history.pushState(null,"","#"+p)}catch{}route()},
 tab(t){AT=t.dataset.v;adm()},
 logout(){ADM=false;adm()},
 del(t){const id=t.dataset.id;ask("Tort o‘chirilsinmi?",()=>{db.products=db.products.filter(p=>p.id!=id);save();adm()})},
 delo(t){const id=t.dataset.id;ask("Buyurtma o‘chirilsinmi?",()=>{db.orders=db.orders.filter(o=>o.id!=id);save();adm()})},
 delr(t){db.reviews[t.dataset.id].splice(t.dataset.i,1);save();adm()},
 rmb(){db.site.bImg="";save();toast("Olib tashlandi")},
 reset(){ask("Sayt sozlamalari boshlang‘ich holatga qaytsinmi?",()=>{db.site=seed().site;save();skin();adm()})}
};
document.addEventListener("click",e=>{if(e.target.id=="md"){closeM();return}const g=e.target.closest("[data-go]");if(g){e.preventDefault();go(g.dataset.go);return}const t=e.target.closest("[data-act]");if(t)A[t.dataset.act]?.(t,e)});
document.addEventListener("dragstart",e=>{const t=e.target.closest("[data-t]");if(t)e.dataTransfer.setData("text/plain",t.dataset.t)});
document.addEventListener("change",async e=>{const t=e.target,k=t.dataset.ch;if(!k)return;
 if(k=="sort"){F.sort=t.value;upd();return}
 if(k=="pf"){const p=byId(t.dataset.id),f=t.dataset.f;if(t.type=="file"){if(!t.files[0])return;p.img=await rd(t.files[0],800);save();adm();toast("Rasm almashtirildi");return}p[f]=t.type=="checkbox"?t.checked:t.type=="number"?Math.max(0,+t.value):t.value}
 if(k=="price")db.prices[t.dataset.k]=+t.value;
 if(k=="st")db.orders.find(o=>o.id==t.dataset.id).status=t.value;
 if(k=="site"){const f=t.dataset.f;if(t.type=="file"){if(!t.files[0])return;db.site.bImg=await rd(t.files[0],1400)}else db.site[f]=t.type=="number"?+t.value:t.value;if(f=="cats")F.cat="Hammasi";skin()}
 save();toast("Saqlandi")});
async function submitForm(f){const k=f.dataset.form,els=[...f.querySelectorAll("[name]")];if(els.some(x=>x.required&&!x.value.trim())){toast("Barcha maydonlarni to‘ldiring");return}const d=Object.fromEntries(els.map(x=>[x.name,x.value])),file=f.querySelector("[type=file]")?.files[0];
 if(k=="login"){if(d.pw==(db.site.pw||ADMIN_PASS)){ADM=true;adm()}else toast("Parol noto‘g‘ri")}
 if(k=="review"){const id=f.dataset.id;(db.reviews[id]=db.reviews[id]||[]).push({name:d.name,rating:+d.rating,text:d.text,img:file?await rd(file,600):""});save();prod(+id)}
 if(k=="order"){const m=money();db.orders.push({id:db.nid++,date:new Date().toLocaleString("ru-RU"),name:d.name,phone:d.phone,address:d.address,status:"Yangi",sub:m.sub,fee:m.fee,total:m.total,
  items:db.cart.map(c=>({name:c.name,qty:c.qty,price:c.price,ings:c.ings,img:c.img||pic(byId(c.pid)||{color:"#ddd"})}))});db.cart=[];save();badges();app.innerHTML='<div class="box" style="margin-top:20px"><h2>Buyurtma qabul qilindi 🎉</h2><p>Operator tez orada siz bilan bog‘lanadi.</p><a class="cta" href="#/" data-go="/">Katalogga qaytish</a></div>'}
 if(k=="newp"){db.products.push({id:db.nid++,name:d.name,desc:d.desc,weight:d.weight,price:+d.price,cat:d.cat,color:"#f6d5dc",r:0,n:0,disc:0,off:false,img:file?await rd(file,800):""});save();adm();toast("Katalogga qo‘shildi")}}
A.sub=t=>submitForm(t.closest("[data-form]"));
document.addEventListener("keydown",e=>{if(e.key=="Escape")closeM();if(e.key=="Enter"&&e.target.tagName=="INPUT"&&e.target.type!="file"){const f=e.target.closest("[data-form]");if(f){e.preventDefault();submitForm(f)}}});
$("#q").addEventListener("input",e=>{F.q=e.target.value;if(cur!="/")go("/");else upd()});

/* ===== Router ===== */
let cur;try{cur=location.hash.slice(1)||"/"}catch{cur="/"}
let hist=[];
function go(p){if(p!==cur)hist.push(cur);cur=p;try{history.pushState(null,"","#"+p)}catch{}route()}
function route(keep){const[a,b]=cur.split("/").filter(Boolean);
 if(!a)home();else if(a=="tort")prod(+b);else if(a=="savat")cartPage();else if(a=="sevimli"){app.innerHTML=`<div class="bar"><h2>Sevimlilar</h2></div>${list(db.products.filter(p=>db.favs.includes(p.id)))}`}
 else if(a=="konstruktor")cons();else if(a=="admin")adm();else home();
 if(a)app.insertAdjacentHTML("afterbegin",'<button class="ghost" data-act="back" style="margin-top:14px">← Orqaga</button>');
 $$(".nav a[data-go],.bn a").forEach(l=>l.classList.toggle("on",l.dataset.go==="/"+(a||"")||(a=="tort"&&l.dataset.go=="/")));
 if(keep!==true)window.scrollTo(0,0)}
addEventListener("popstate",()=>{try{cur=location.hash.slice(1)||"/"}catch{}route()});
skin();badges();route();
</script>
